<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>HTW 工作台</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <h1>HTW 工作台</h1>
      <button class="nav-item active" data-skill="insight">洞察 Analysis</button>
      <button class="nav-item" data-skill="edit">剪辑 Edit</button>
      <button class="nav-item" data-skill="tools">工具 Tools</button>
      <button class="nav-item" data-skill="publish">发布 Publish</button>
      <button class="nav-item" data-skill="create">创作 Create</button>
      <button class="nav-item" data-skill="settings">设置 Settings</button>
    </aside>
    <main class="main">
      <section class="panel active" id="panel-insight"></section>
      <section class="panel" id="panel-edit"></section>
      <section class="panel" id="panel-tools"></section>
      <section class="panel" id="panel-publish"></section>
      <section class="panel" id="panel-create"></section>
      <section class="panel" id="panel-settings">
        <h2>设置</h2>
        <div class="card">
          <div class="field">
            <label>API 地址</label>
            <input type="text" id="api-base" placeholder="https://htwmedia.dpdns.org" />
          </div>
          <div class="field">
            <label>AuthKey</label>
            <input type="password" id="api-key" placeholder="粘贴你的 AuthKey" />
            <span class="hint">密钥仅保存在内存，重启客户端后需重新填写。</span>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/skills/insight.js"></script>
  <script src="js/skills/edit.js"></script>
  <script src="js/skills/tools.js"></script>
  <script src="js/skills/publish.js"></script>
  <script src="js/skills/create.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
