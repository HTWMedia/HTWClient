<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>HTW 工作台</title>
  <link rel="stylesheet" href="libs/font-awesome/all.min.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <h1>HTW 工作台</h1>
      <button class="nav-item active" data-skill="tools"><i class="fa-solid fa-toolbox"></i>工具 Tools</button>
      <button class="nav-item" data-skill="insight"><i class="fa-solid fa-chart-line"></i>洞察 Analysis</button>
      <button class="nav-item" data-skill="create"><i class="fa-solid fa-wand-magic-sparkles"></i>创作 Create</button>
      <button class="nav-item" data-skill="edit"><i class="fa-solid fa-scissors"></i>剪辑 Edit</button>
      <button class="nav-item" data-skill="publish"><i class="fa-solid fa-paper-plane"></i>发布 Publish</button>
      <button class="nav-item" data-skill="settings"><i class="fa-solid fa-gear"></i>设置 Settings</button>
    </aside>
    <main class="main">
      <div id="key-warning" class="key-warning" hidden></div>
      <section class="panel active" id="panel-insight"></section>
      <section class="panel" id="panel-edit"></section>
      <section class="panel" id="panel-tools"></section>
      <section class="panel" id="panel-publish"></section>
      <section class="panel" id="panel-create"></section>
      <section class="panel" id="panel-settings">
        <h2>设置</h2>
        <div class="card">
          <div class="field">
            <label>API 地址</label>
            <input type="text" id="api-base" placeholder="https://htwmedia.dpdns.org" />
          </div>
          <div class="field">
            <label>AuthKey</label>
            <input type="password" id="api-key" placeholder="粘贴你的 AuthKey" />
            <div class="inline" style="margin-top:8px;">
              <button class="btn" type="button" id="get-key-btn">前往 web 端获取 AuthKey</button>
              <span class="hint" id="key-status"></span>
            </div>
            <span class="hint">密钥保存在本机应用数据中（明文），重启后自动填充；换设备需重新获取。若没有 AuthKey，可在 web 端通过邮箱申请（有效期 30 天）。</span>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="libs/marked.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/skills/insight.js"></script>
  <script src="js/skills/edit.js"></script>
  <script src="js/skills/tools.js"></script>
  <script src="js/skills/publish.js"></script>
  <script src="js/skills/create.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
